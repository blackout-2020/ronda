<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota de Ronda - Guarda</title>
    <!-- Importando o mapa gratuito Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; cursor: crosshair; }

        /* PAINEL SUPERIOR DE ADIÇÃO DE NOVO PONTO */
        .painel-adicionar {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: white; padding: 12px 16px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 92%; max-width: 680px;
            display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center;
        }

        .painel-adicionar input {
            padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 12px;
        }
        .input-id { width: 55px; text-align: center; }
        .input-nome { flex: 1; min-width: 140px; }
        .input-busca { flex: 1; min-width: 130px; }
        .input-coord { width: 105px; text-align: center; }

        .btn-add {
            background: #17a2b8; color: white; border: none; padding: 8px 12px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;
            transition: background 0.2s;
        }
        .btn-add:hover { background: #138496; }

        .btn-copiar {
            background: #6f42c1; color: white; border: none; padding: 8px 12px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;
        }
        .btn-copiar:hover { background: #5a32a3; }

        .dica-clique {
            width: 100%; text-align: center; font-size: 11px; color: #666; margin-top: 2px;
        }

        /* PAINEL INFERIOR DE NAVEGAÇÃO DO GUARDA */
        .painel-guarda {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: white; padding: 15px 20px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; width: 85%; max-width: 420px;
        }

        .btn-acao { 
            background: #28a745; color: white; border: none; padding: 10px 14px; 
            border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; margin: 3px; 
        }
        .btn-acao:hover { background: #218838; }
        .btn-secundario { background: #007bff; }
        .btn-secundario:hover { background: #0056b3; }
        .btn-waze { background: #33CCFF; color: #000; }
        .btn-gmaps { background: #4285F4; }
        .btn-perigo { background: #dc3545; }
        .btn-perigo:hover { background: #bd2130; }
        
        #status-texto { font-size: 14px; color: #111; margin: 0 0 4px 0; font-weight: bold; }
        #distancia-texto { font-size: 12px; color: #555; margin: 0 0 10px 0; }

        /* ESTILOS DOS MARCADORES DE PONTOS NO MAPA */
        .marcador-numero {
            background: #007bff; color: white; border-radius: 50%; text-align: center;
            font-weight: bold; font-size: 11px; line-height: 24px; border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .marcador-inicio {
            background: #28a745; color: white; border-radius: 50%; text-align: center;
            font-size: 14px; line-height: 28px; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .marcador-alvo {
            background: #ff9800; color: white; border-radius: 50%; text-align: center;
            font-weight: bold; font-size: 13px; line-height: 26px; border: 3px solid #fff;
            box-shadow: 0 0 12px rgba(255,152,0,0.9); animation: pulsar 1.5s infinite;
        }
        .marcador-concluido {
            background: #6c757d; color: white; border-radius: 50%; text-align: center;
            font-size: 11px; line-height: 24px; border: 2px solid white; opacity: 0.55;
        }

        @keyframes pulsar {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        .btn-gps-popup {
            display: inline-block; padding: 5px 8px; border-radius: 4px; color: white;
            text-decoration: none; font-size: 11px; font-weight: bold; margin-right: 4px; margin-top: 6px;
        }

        /* MODAL DE CÓDIGO JS */
        #modal-codigo {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-conteudo {
            background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 600px;
            max-height: 80vh; display: flex; flex-direction: column;
        }
        .modal-conteudo textarea {
            width: 100%; height: 250px; font-family: monospace; font-size: 11px; margin-top: 10px;
        }
    </style>
</head>

        // API OSRM NEAREST (Ajuste para a via mais próxima)
        async function snapToRoad(lat, lng) {
            if (!lat || !lng || isNaN(lat) || isNaN(lng)) return { lat, lng };
            try {
                const url = `https://router.project-osrm.org/nearest/v1/driving/${lng},${lat}`;
                const response = await fetch(url);
                const data = await response.json();
                if (data.code === 'Ok' && data.waypoints && data.waypoints.length > 0) {
                    const [snappedLng, snappedLat] = data.waypoints[0].location;
                    return { lat: snappedLat, lng: snappedLng };
                }
            } catch (error) {
                console.warn("Falha no OSRM. Mantendo ponto original:", error);
            }
            return { lat, lng };
        }

        // PROCESSAR E ADICIONAR NOVO PONTO
        async function processarEAdicionarPonto() {
            const idVal = document.getElementById('novo-id').value.trim();
            const nomeVal = document.getElementById('novo-nome').value.trim();
            const buscaVal = document.getElementById('novo-busca').value.trim();
            const latVal = document.getElementById('novo-lat').value.trim();
            const lngVal = document.getElementById('novo-lng').value.trim();

            if (!idVal) {
                alert("Por favor, informe o Número do Índice (Nº ID).");
                return;
            }

            const novoId = parseInt(idVal, 10);
            let finalLat = null;
            let finalLng = null;
            const statusElem = document.getElementById('status-texto');

            // Opção A: Já digitou ou clicou no mapa para obter Lat/Lng
            if (latVal && lngVal && !isNaN(parseFloat(latVal)) && !isNaN(parseFloat(lngVal))) {
                finalLat = parseFloat(latVal);
                finalLng = parseFloat(lngVal);
            } 
            // Opção B: Tentar buscar por texto de endereço
            else if (buscaVal !== "") {
                statusElem.innerText = "🔍 Buscando endereço...";
                try {
                    const urlGeo = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(buscaVal + " Carlópolis BR")}`;
                    const response = await fetch(urlGeo);
                    const dataGeo = await response.json();

                    if (dataGeo && dataGeo.length > 0) {
                        finalLat = parseFloat(dataGeo[0].lat);
                        finalLng = parseFloat(dataGeo[0].lon);
                    } else {
                        alert("Endereço não encontrado! Clique direto no local do mapa para definir a posição.");
                        statusElem.innerText = "Pronto para navegar.";
                        return;
                    }
                } catch (e) {
                    alert("Erro ao buscar endereço na internet. Por favor, clique no mapa ou digite as Coordenadas.");
                    statusElem.innerText = "Pronto para navegar.";
                    return;
                }
            } else {
                alert("Preencha o Endereço de Busca OU clique no mapa para capturar a Latitude/Longitude!");
                return;
            }

            statusElem.innerText = "Ajustando ponto na pista...";
            const coordAjustada = await snapToRoad(finalLat, finalLng);

            const nomeFinal = nomeVal !== "" ? nomeVal : (buscaVal !== "" ? buscaVal : `Ponto ${novoId}`);

            const novoPonto = {
                id: novoId,
                nome: nomeFinal,
                lat: coordAjustada.lat,
                lng: coordAjustada.lng,
                coletada: false
            };

            // Remove da lista se já existir o mesmo ID para atualizar
            pontosTratadosGlobal = pontosTratadosGlobal.filter(p => p.id !== novoId);
            
            // Adiciona e reordena
            pontosTratadosGlobal.push(novoPonto);
            pontosTratadosGlobal.sort((a, b) => a.id - b.id);

            // Limpa ponteiro temporário
            if (marcadorTempClique) {
                map.removeLayer(marcadorTempClique);
                marcadorTempClique = null;
            }

            // Limpa os campos
            document.getElementById('novo-id').value = '';
            document.getElementById('novo-nome').value = '';
            document.getElementById('novo-busca').value = '';
            document.getElementById('novo-lat').value = '';
            document.getElementById('novo-lng').value = '';

            renderizarMapa();
            map.setView([coordAjustada.lat, coordAjustada.lng], 17);
            statusElem.innerText = `✅ Ponto ${novoId} adicionado com sucesso!`;
            alert(`Ponto ${novoId} adicionado com sucesso na rota!`);
        }

                    <b>Parada ${ponto.id}</b><br>${ponto.nome}<br>
                    <div style="margin-top:6px;">
                        <a href="${linkGoogle}" target="_blank" class="btn-gps-popup btn-gmaps">Google Maps</a>
                        <a href="${linkWaze}" target="_blank" class="btn-gps-popup btn-waze">Waze</a>
                    </div>
                `;

                const marker = L.marker([ponto.lat, ponto.lng], { icon: icone })
                    .addTo(map)
                    .bindPopup(popupHtml);

                marcadoresCamadas.push(marker);
                coordenadasLinha.push([ponto.lat, ponto.lng]);
            });

            if (coordenadasLinha.length > 0) {
                linhaPolyline = L.polyline(coordenadasLinha, {
                    color: 'blue', weight: 4, opacity: 0.6, dashArray: '8, 8'
                }).addTo(map);
            }
        }

        // CONTROLES DE NAVEGAÇÃO GUIADA
        function iniciarRonda() {
            emNavegacao = true;
            pontoAtualIndex = pontosTratadosGlobal.findIndex(p => !p.coletada);
            if (pontoAtualIndex === -1) pontoAtualIndex = 0;

            atualizarEstadoNavegacao();
        }

        function concluirPontoAtual() {
            tocarBeep();
            pontosTratadosGlobal[pontoAtualIndex].coletada = true;
            pontoAtualIndex++;

            if (pontoAtualIndex >= pontosTratadosGlobal.length) {
                emNavegacao = false;
                renderizarMapa();
                document.getElementById('status-texto').innerText = "🎉 Ronda Finalizada com Sucesso!";
                document.getElementById('distancia-texto').innerText = "Todos os pontos foram visitados.";
                document.getElementById('botoes-painel').innerHTML = `
                    <button class="btn-acao btn-secundario" onclick="reiniciarRonda()">🔄 Reiniciar Ronda</button>
                    <button class="btn-acao" onclick="centralizarMim()">Centralizar em Mim</button>
                `;
                return;
            }

            atualizarEstadoNavegacao();
        }

        function atualizarEstadoNavegacao() {
            const pontoAtual = pontosTratadosGlobal[pontoAtualIndex];
            renderizarMapa();

            map.setView([pontoAtual.lat, pontoAtual.lng], 17);

            document.getElementById('status-texto').innerText = `Parada ${pontoAtualIndex + 1} de ${pontosTratadosGlobal.length}: ${pontoAtual.nome}`;
            
            document.getElementById('botoes-painel').innerHTML = `
                <button class="btn-acao" onclick="concluirPontoAtual()">✅ Cheguei / Próximo</button>
                <button class="btn-acao btn-waze" onclick="abrirNavegadorExterno('waze')">Waze</button>
                <button class="btn-acao btn-gmaps" onclick="abrirNavegadorExterno('google')">Maps</button>
                <button class="btn-acao btn-perigo" onclick="encerrarRonda()">🛑 Encerrar</button>
            `;

            calcularDistanciaAtePontoAtual();
        }

        function encerrarRonda() {
            emNavegacao = false;
            renderizarMapa();
            document.getElementById('status-texto').innerText = "Ronda pausada.";
            document.getElementById('distancia-texto').innerText = "";
            document.getElementById('botoes-painel').innerHTML = `
                <button class="btn-acao btn-secundario" onclick="iniciarRonda()">▶️ Continuar Ronda</button>
                <button class="btn-acao" onclick="centralizarMim()">Centralizar em Mim</button>
            `;
        }

        function reiniciarRonda() {
            pontosTratadosGlobal.forEach(p => p.coletada = false);
            iniciarRonda();
        }

        function abrirNavegadorExterno(tipo) {
            const ponto = pontosTratadosGlobal[pontoAtualIndex];
            if (!ponto) return;
            
            let url = tipo === 'waze' 
                ? `https://waze.com/ul?ll=${ponto.lat},${ponto.lng}&navigate=yes`
                : `https://www.google.com/maps/dir/?api=1&destination=${ponto.lat},${ponto.lng}`;
            
            window.open(url, '_blank');
        }

        function tocarBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) { console.log("Áudio não permitido"); }
        }

        // GPS EM TEMPO REAL
        function aoMoverGPS(posicao) {
            latGuarda = posicao.coords.latitude;
            lngGuarda = posicao.coords.longitude;

            if (!meuMarcador) {
                meuMarcador = L.circleMarker([latGuarda, lngGuarda], {
                    radius: 9, color: '#fff', fillColor: '#dc3545', fillOpacity: 1, weight: 2
                }).addTo(map).bindPopup("<b>Você está aqui</b>");
                map.setView([latGuarda, lngGuarda], 17);
            } else {
                meuMarcador.setLatLng([latGuarda, lngGuarda]);
            }

            if (emNavegacao) {
                calcularDistanciaAtePontoAtual();
            }
        }

        function calcularDistanciaAtePontoAtual() {
            if (latGuarda === null || lngGuarda === null || !emNavegacao) return;

            const alvo = pontosTratadosGlobal[pontoAtualIndex];
            const distMetros = Math.round(map.distance([latGuarda, lngGuarda], [alvo.lat, alvo.lng]));

            document.getElementById('distancia-texto').innerText = `Distância até o ponto: ${distMetros} metros`;

            if (distMetros <= 25) {
                concluirPontoAtual();
            }
        }

        function erroGPS() {
            document.getElementById('status-texto').innerText = "Aviso: Sinal do GPS fraco ou inativo.";
        }

        function centralizarMim() {
            if (meuMarcador) {
                map.setView(meuMarcador.getLatLng(), 18);
            } else {
                alert("Aguardando sinal do GPS...");
            }
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(aoMoverGPS, erroGPS, {
                enableHighAccuracy: true,
                maximumAge: 3000,
                timeout: 10000
            });
        }

        // Inicializa a rota
        inicializarRota();
    </script>
</body>
</html>
