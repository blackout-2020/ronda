        // 3. Desenha os pontos no mapa e cria a linha da rota na ordem sequencial
        let coordenadasRota = [];
        
        enderecosRonda.forEach((ponto, indice) => {
            let iconePersonalizado;

            // Se for o primeiro ponto (ou ID 1), criamos a bandeira de início verde
            if (indice === 0 || ponto.id === 1) {
                iconePersonalizado = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="marcador-inicio" title="Início da Ronda">🏁</div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });
            } else {
                // Para os demais pontos, exibe um círculo azul contendo o ID exato do endereço
                iconePersonalizado = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="marcador-numero">${ponto.id}</div>`,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });
            }

            // Adiciona o marcador customizado no mapa
            L.marker([ponto.lat, ponto.lng], { icon: iconePersonalizado })
                .addTo(map)
                .bindPopup(`<b>Parada ${ponto.id}</b><br>${ponto.nome}`);

            // Salva a coordenada para traçar a linha da rota
            coordenadasRota.push([ponto.lat, ponto.lng]);
        });

        // Traça uma linha azul tracejada conectando os pontos da ronda na ordem da lista
        if (coordenadasRota.length > 0) {
            L.polyline(coordenadasRota, {
                color: 'blue',
                weight: 4,
                opacity: 0.6,
                dashArray: '10, 10'
            }).addTo(map);
        }

        // 4. Gerencia a localização em tempo real do próprio celular do guarda
        let meuMarcador = null;
        let primeiraVez = true;

        function aoMoverGPS(posicao) {
            const lat = posicao.coords.latitude;
            const lng = posicao.coords.longitude;

            document.getElementById('status-texto').innerText = "GPS Ativo - Siga a linha azul da rota";

            if (!meuMarcador) {
                // Cria um marcador vermelho em destaque para o guarda saber onde ele está
                meuMarcador = L.circleMarker([lat, lng], {
                    radius: 9,
                    color: '#fff',
                    fillColor: '#dc3545', // Vermelho vivo
                    fillOpacity: 1,
                    weight: 2
                }).addTo(map).bindPopup("<b>Você está aqui</b>");
            } else {
                meuMarcador.setLatLng([lat, lng]);
            }

            // Centraliza o mapa automaticamente na primeira leitura do GPS
            if (primeiraVez) {
                map.setView([lat, lng], 17);
                primeiraVez = false;
            }
        }

        function erroGPS(erro) {
            document.getElementById('status-texto').innerText = "Erro no GPS: Ative a localização do celular.";
        }

        function centralizarMim() {
            if (meuMarcador) {
                map.setView(meuMarcador.getLatLng(), 18);
            } else {
                alert("Aguardando sinal do GPS...");
            }
        }

        // Ativa o sensor de GPS do celular do guarda
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(aoMoverGPS, erroGPS, {
                enableHighAccuracy: true,
                maximumAge: 5000,
                timeout: 15000
            });
        } else {
            alert("Suporte de geolocalização indisponível neste dispositivo.");
        }
